name: release

# 发布由 tag 触发：推送 v0.0.1 这样的 tag 才会发 npm。
#
# 认证方式：npm Trusted Publishing（GitHub OIDC），不需要 NPM_TOKEN。
# 前置条件（在 npmjs.com 的包设置里配置一次）：
#   Package settings -> Trusted publishing -> GitHub Actions
#   Repository: Jason0826/soulbridge
#   Workflow filename: release.yml
#   Environment: 留空
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC：npm 用它验证"这次发布确实来自这个仓库的这次运行"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 故意不设 registry-url：它会在 .npmrc 里写一个 token 占位符，
          # 而我们走 OIDC，不需要任何 token。
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke-test the published shape
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"
          npx --no-install soulbridge stats

      - name: Verify the tarball contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --provenance
